name: Windows Portable

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      build_mode:
        description: "fast 关闭 LTO（构建更快、体积略大）；release 使用 thin LTO"
        required: true
        type: choice
        default: release
        options:
          - release
          - fast

permissions:
  actions: write
  contents: read

concurrency:
  group: windows-portable-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "7200"

jobs:
  build:
    name: Build Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          cache: false
          rustflags: ""

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Initialize sccache
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server
          sccache --zero-stats
          sccache --show-stats

      - name: Restore shared Cargo inputs
        id: cargo-inputs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: navop-cargo-inputs-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            navop-cargo-inputs-v1-${{ runner.os }}-

      - name: Install NASM
        shell: pwsh
        run: |
          cmake --version
          choco install nasm --no-progress --yes
          $nasmDir = Join-Path $env:ProgramFiles "NASM"
          $nasmExe = Join-Path $nasmDir "nasm.exe"
          if (-not (Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
            throw "NASM executable was not found at '$nasmExe'"
          }
          $env:Path = "$nasmDir;$env:Path"
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          nasm -v

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check optional Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase secrets not set; building portable binary without baked-in cloud login/sync (runtime env override still works)."
          fi

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            awk -F'"' '
              /^\[package\]$/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^version = "/ { print $2; exit }
            ' main/Cargo.toml
          )"
          if [ -z "$version" ]; then
            echo "::error::Failed to read version from main/Cargo.toml"
            exit 1
          fi
          echo "ONETCLI_VERSION=$version" >> "$GITHUB_ENV"
          echo "Resolved Navop version: $version"

      - name: Build release binary
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NAVOP_PUBLIC_BASE_URL: ${{ vars.NAVOP_PUBLIC_BASE_URL }}
          NAVOP_WEBSITE_BASE_URL: ${{ vars.NAVOP_WEBSITE_BASE_URL }}
          ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE: ${{ vars.ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) {
            throw "VCToolsInstallDir is not configured"
          }

          $target = "x86_64-pc-windows-msvc"
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker was not found at '$linker'"
          }

          $linkerEnvironmentName = "CARGO_TARGET_$($target.Replace('-', '_').ToUpperInvariant())_LINKER"
          [Environment]::SetEnvironmentVariable(
            $linkerEnvironmentName,
            $linker,
            [EnvironmentVariableTarget]::Process
          )

          cargo --version
          rustc --version
          Write-Host "Using MSVC linker for ${target}: $linker"
          if ("${{ inputs.build_mode }}" -eq "fast") {
            $env:CARGO_PROFILE_RELEASE_LTO = "false"
            $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16"
            Write-Host "Fast build mode: LTO disabled, codegen-units=16"
          }
          cargo build `
            --release `
            -p main `
            --features windows-native-rdp `
            --target $target

          $binary = "target\$target\release\navop.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Release binary was not created: '$binary'"
          }

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable-package | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\navop.exe" "portable-package\navop.exe"
          Set-Content -Path "portable-package\navop.portable" -Value "" -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: navop-windows-x64-portable
          path: portable-package/
          if-no-files-found: error

      - name: Save shared Cargo inputs
        if: >-
          ${{
            always() &&
            steps.cargo-inputs-cache.outcome == 'success' &&
            steps.cargo-inputs-cache.outputs.cache-hit != 'true'
          }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ steps.cargo-inputs-cache.outputs.cache-primary-key }}

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true
